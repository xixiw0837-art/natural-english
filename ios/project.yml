name: NaturalEnglish
options:
  bundleIdPrefix: com.linguakey.demo
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  NaturalEnglish:
    type: application
    platform: iOS
    sources:
      - path: NaturalEnglish
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LinguaKey
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: NaturalEnglishKeyboard
        embed: true
  NaturalEnglishKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: NaturalEnglishKeyboard
    info:
      path: NaturalEnglishKeyboard/Info.plist
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.linguakey.demo.NaturalEnglishKeyboard
        APPLICATION_EXTENSION_API_ONLY: YES
